name: 自动构建并发布算力服务镜像 (GHCR)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: 🔨 构建与发布算力微服务镜像
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: ta-lib
            context: .
            dockerfile: ta-lib/Dockerfile
            image_name: pixel-flow-intelligence/nofx-talib
          - name: pandas-ta
            context: .
            dockerfile: pandas-ta/Dockerfile
            image_name: pixel-flow-intelligence/nofx-pandas-ta
          - name: trendln
            context: .
            dockerfile: trendln/Dockerfile
            image_name: pixel-flow-intelligence/nofx-trendln
          - name: ccxt
            context: .
            dockerfile: ccxt/Dockerfile
            image_name: pixel-flow-intelligence/nofx-ccxt

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像 Tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,prefix=sha-,format=short

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
