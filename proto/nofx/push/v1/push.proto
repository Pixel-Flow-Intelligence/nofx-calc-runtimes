syntax = "proto3";

package nofx.push.v1;

option go_package = "nofx/proto/gen/go/nofx/push/v1;pushv1";

service PushPublishService {
  rpc PublishEvent(PublishEventRequest) returns (PublishEventResponse);
  rpc PublishBatch(PublishBatchRequest) returns (PublishBatchResponse);
}

message PublishEventRequest {
  string event_id = 1;
  string topic = 2;
  string source_service = 3;
  string source_kind = 4;
  bool replayable = 5;
  string scope = 6;
  string user_id = 7;
  string agent_id = 8;
  string symbol = 9;
  string payload_json = 10;
}

message PublishEventResponse {
  bool ok = 1;
  string message = 2;
}

message PublishBatchRequest {
  repeated PublishEventRequest events = 1;
}

message PublishBatchResponse {
  bool ok = 1;
  repeated PublishEventResponse results = 2;
}
