syntax = "proto3";

package nofx.analytics.v1;

import "nofx/common/v1/errors.proto";

option go_package = "nofx/proto/gen/go/nofx/analytics/v1;analyticsv1";

// AnalyticsCommandService 定义 analytics-runtime 对其它 runtime 暴露的写操作能力。
service AnalyticsCommandService {
  rpc RunMarketResearchOnce(RunMarketResearchOnceRequest) returns (RunMarketResearchOnceResponse);
  rpc UpsertMarketResearchTask(UpsertMarketResearchTaskRequest) returns (UpsertMarketResearchTaskResponse);
}

message RunMarketResearchOnceRequest {
  string caller_service = 1;
}

message RunMarketResearchOnceResponse {
  bool accepted = 1;
  nofx.common.v1.ErrorDetail error = 2;
}

message UpsertMarketResearchTaskRequest {
  string input_json = 1;
}

message UpsertMarketResearchTaskResponse {
  string json_payload = 1;
  nofx.common.v1.ErrorDetail error = 2;
}
